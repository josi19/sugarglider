name: Release

on:
  # Either push a tag yourself…
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  # …or run this workflow and let it derive + create the tag.
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (auto = derive from Conventional Commits)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      dry_run:
        description: "Build and package, but don't tag or publish"
        type: boolean
        default: false

permissions:
  contents: write

# Never let two releases interleave; queue instead of cancelling a half-published one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.version }}
      zip_sha256: ${{ steps.checksums.outputs.zip_sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # version + changelog need the full tag/commit history

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve version
        id: version
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            previous="$(scripts/version.sh previous "${GITHUB_REF_NAME}")"
          else
            version="$(scripts/version.sh next "${BUMP}")"
            previous="$(scripts/version.sh latest)"
            if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
              echo "::error::Tag v${version} already exists. Pick an explicit bump or delete the tag."
              exit 1
            fi
            # Only guards the auto path: an explicit bump — or a hand-pushed tag —
            # is a deliberate statement that this should ship regardless.
            if [[ "${BUMP}" == "auto" ]] && ! scripts/version.sh app-changed; then
              echo "::error::Nothing under Sources/, Resources/ or Package.swift changed since ${previous}, so the built app would be byte-identical. Re-run with bump=patch (or minor/major) to release anyway."
              exit 1
            fi
          fi
          echo "version=${version}"   >> "$GITHUB_OUTPUT"
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${version} (previous: ${previous:-none})" >> "$GITHUB_STEP_SUMMARY"

      - name: Test
        run: swift test

      - name: Import signing certificate
        id: signing
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CERT_P12}" ]]; then
            echo "identity=-"      >> "$GITHUB_OUTPUT"
            echo "notarize=false"  >> "$GITHUB_OUTPUT"
            echo "::warning::No MACOS_CERTIFICATE_P12 secret — building ad-hoc signed. Downloads stay Gatekeeper-quarantined; see the release notes."
            exit 0
          fi

          # A throwaway keychain, unlocked only for this job.
          KEYCHAIN="${RUNNER_TEMP}/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security set-keychain-settings -lut 3600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"

          printf '%s' "${CERT_P12}" | base64 --decode > "${RUNNER_TEMP}/cert.p12"
          security import "${RUNNER_TEMP}/cert.p12" -k "${KEYCHAIN}" -P "${CERT_PASSWORD}" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "${RUNNER_TEMP}/cert.p12"
          # Without this, codesign blocks on an interactive keychain prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}" > /dev/null
          # Search list = just this keychain. Nothing else in the job needs the
          # login keychain, and naming it portably is fiddlier than it looks.
          security list-keychain -d user -s "${KEYCHAIN}"

          # MACOS_SIGN_IDENTITY is optional: fall back to whatever Developer ID
          # the certificate actually carries.
          if [[ -z "${IDENTITY}" ]]; then
            IDENTITY="$(security find-identity -v -p codesigning "${KEYCHAIN}" \
              | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          fi
          if [[ -z "${IDENTITY}" ]]; then
            echo "::error::Imported the certificate but found no 'Developer ID Application' identity in it."
            exit 1
          fi
          echo "Signing as: ${IDENTITY}"

          echo "identity=${IDENTITY}" >> "$GITHUB_OUTPUT"
          if [[ -n "${APPLE_ID}" ]]; then
            echo "notarize=true" >> "$GITHUB_OUTPUT"
          else
            echo "notarize=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signed but not notarized (APPLE_ID secret missing)."
          fi

      - name: Build universal app bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          UNIVERSAL: "1"
        run: ./build.sh

      - name: Package ZIP
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ditto -c -k --keepParent Sugarglider.app "dist/Sugarglider-${VERSION}.zip"

      - name: Notarize app
        if: steps.signing.outputs.notarize == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          scripts/notarize.sh "dist/Sugarglider-${VERSION}.zip"
          xcrun stapler staple Sugarglider.app
          # Re-zip so the download itself carries the ticket and Gatekeeper
          # clears it without a network round-trip.
          rm "dist/Sugarglider-${VERSION}.zip"
          ditto -c -k --keepParent Sugarglider.app "dist/Sugarglider-${VERSION}.zip"

      - name: Package DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: scripts/make-dmg.sh

      - name: Notarize DMG
        if: steps.signing.outputs.notarize == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: scripts/notarize.sh "dist/Sugarglider-${VERSION}.dmg" --staple

      - name: Checksums
        id: checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 "Sugarglider-${VERSION}.zip" "Sugarglider-${VERSION}.dmg" > checksums.txt
          cat checksums.txt
          echo "zip_sha256=$(shasum -a 256 "Sugarglider-${VERSION}.zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          NOTARIZED: ${{ steps.signing.outputs.notarize }}
        run: |
          set -euo pipefail
          scripts/release-notes.sh "${VERSION}" "${PREVIOUS}" HEAD > "${RUNNER_TEMP}/notes.md"
          cat "${RUNNER_TEMP}/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Sugarglider-${{ steps.version.outputs.version }}
          path: dist/
          retention-days: 14
          if-no-files-found: error

      - name: Create tag
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          # Pushes authenticated with GITHUB_TOKEN don't trigger workflows, so
          # this cannot loop back into this workflow's own tag trigger.
          git push origin "v${VERSION}"

      - name: Publish GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" \
            --title "Sugarglider ${VERSION}" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            --verify-tag \
            "dist/Sugarglider-${VERSION}.zip" \
            "dist/Sugarglider-${VERSION}.dmg" \
            "dist/checksums.txt"

      - name: Commit changelog to the default branch
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch origin "${DEFAULT_BRANCH}"
          git checkout -B "${DEFAULT_BRANCH}" "origin/${DEFAULT_BRANCH}"
          scripts/changelog.sh prepend "${VERSION}" "${PREVIOUS}" "v${VERSION}"

          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md already up to date."
            exit 0
          fi
          git add CHANGELOG.md
          git commit -m "docs: changelog for v${VERSION} [skip ci]"
          # A protected default branch rejects this; the release itself is
          # already published, so warn instead of failing it retroactively.
          git push origin "${DEFAULT_BRANCH}" || \
            echo "::warning::Could not push CHANGELOG.md to ${DEFAULT_BRANCH} (branch protection?). Run 'scripts/changelog.sh prepend ${VERSION}' locally and commit it."

  homebrew:
    name: Update Homebrew cask
    needs: release
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Push cask to tap
        env:
          # Fine-grained PAT with contents:write on the tap repo. Unset = skip.
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
          VERSION: ${{ needs.release.outputs.version }}
          SHA256: ${{ needs.release.outputs.zip_sha256 }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::notice::HOMEBREW_TAP_TOKEN not set — skipping the cask update."
            exit 0
          fi
          TAP_REPO="${TAP_REPO:-${GITHUB_REPOSITORY_OWNER}/homebrew-tap}"

          gh repo clone "${TAP_REPO}" tap -- --depth=1
          mkdir -p tap/Casks
          sed -e "s|__VERSION__|${VERSION}|g" \
              -e "s|__SHA256__|${SHA256}|g" \
              -e "s|__REPO__|${GITHUB_REPOSITORY}|g" \
              .github/homebrew/sugarglider.rb.tmpl > tap/Casks/sugarglider.rb

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage first, then compare against the index: a plain `git diff` only
          # looks at tracked files, so the very first release — where the cask is
          # a new untracked file — would read as "nothing changed".
          git add Casks/sugarglider.rb
          if git diff --cached --quiet; then
            echo "Cask already at ${VERSION}."
            exit 0
          fi
          git commit -m "sugarglider ${VERSION}"
          # -u origin HEAD rather than a bare push: a tap repo created without an
          # initial commit clones to an unborn branch with no upstream.
          git push -u origin HEAD
